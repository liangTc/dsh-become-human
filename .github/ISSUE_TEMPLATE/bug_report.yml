name: 缺陷报告 / Bug report
description: 报告可复现的问题，请移除凭据与私人聊天。
labels: []
body:
  - type: markdown
    attributes:
      value: "这是未完成的测试版。请勿上传 API key、登录链接、二维码、数据库或真实聊天内容。"
  - type: input
    id: versions
    attributes:
      label: 插件 / DSH / Node / Windows 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏的错误码
    validations:
      required: true
